<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>악보 다운로드</title>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:'Gowun Dodum','Malgun Gothic',sans-serif;
  background:
    radial-gradient(ellipse 900px 500px at 12% -8%, rgba(255,145,102,.16), transparent 62%),
    radial-gradient(ellipse 900px 600px at 108% 8%, rgba(200,156,255,.14), transparent 60%),
    radial-gradient(ellipse 1100px 700px at 50% 118%, rgba(255,212,71,.10), transparent 60%),
    #173226;
  min-height:100vh;
  padding:40px 20px 60px;
}
.wrap{ width:100%; max-width:760px; margin:0 auto; }
a.back{
  display:inline-flex; align-items:center; gap:.4rem;
  color:#BFD1C2; text-decoration:none; font-size:11pt; margin-bottom:1.6rem;
}
a.back:hover{ color:#FAF7EA; }
.main-title{
  color:#FAF7EA;
  font-family:'Gowun Batang',serif;
  font-size:28pt;
  font-weight:700;
  text-align:center;
  margin-bottom:2rem;
}
.song-block{
  background:#254435;
  border:1px solid #3E6350;
  border-radius:18px;
  padding:1.5rem 1.7rem;
  margin-bottom:1.3rem;
  box-shadow:0 16px 34px -16px rgba(0,0,0,.6);
}
.song-block h2{
  font-family:'Gowun Batang',serif;
  font-size:18pt;
  margin-bottom:1rem;
}
.song-block.a h2{ color:#FF9166; }
.song-block.b h2{ color:#C89CFF; }
.song-block.n h2{ color:#FFD447; }
.file-row{
  display:flex; align-items:center; justify-content:space-between; gap:1rem;
  padding:.7rem 0;
  border-top:1px solid #3E6350;
}
.file-row:first-of-type{ border-top:none; }
.file-name{ color:#BFD1C2; font-size:12pt; }
.dl-btn{
  flex:0 0 auto;
  display:inline-flex; align-items:center; gap:.4rem;
  padding:.5rem 1.1rem;
  border-radius:999px;
  text-decoration:none;
  font-size:11pt; font-weight:700;
  border:1px solid;
  transition:transform .15s;
}
.dl-btn:hover{ transform:translateY(-2px); }
.song-block.a .dl-btn{ background:rgba(255,145,102,.18); color:#FF9166; border-color:#FF9166; }
.song-block.b .dl-btn{ background:rgba(200,156,255,.18); color:#C89CFF; border-color:#C89CFF; }
.song-block.n .dl-btn{ background:rgba(255,212,71,.18); color:#FFD447; border-color:#FFD447; }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="index.html">← 처음으로</a>
  <div class="main-title">악보 다운로드</div>

  <div class="song-block a">
    <h2>생각해줘요 · 라 캄파넬라</h2>
    <div class="file-row">
      <span class="file-name">수행평가용 계이름 악보 (HWP)</span>
      <a class="dl-btn" href="리코더 수행평가 계이름 악보 (생각해줘요 와 라캄파넬라).hwpx" download>⬇ 다운로드</a>
    </div>
  </div>

  <div class="song-block n">
    <h2>녹턴</h2>
    <div class="file-row">
      <span class="file-name">수행평가용 악보 (JPG)</span>
      <a class="dl-btn" href="리코더 수행평가 계이름 악보 (녹턴).jpg" download>⬇ 다운로드</a>
    </div>
  </div>

</div>
</body>
</html>
