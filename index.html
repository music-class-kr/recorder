<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>소프라노 리코더 수업 자료</title>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:'Gowun Dodum','Malgun Gothic',sans-serif;
  background:
    radial-gradient(ellipse 900px 500px at 12% -8%, rgba(255,145,102,.16), transparent 62%),
    radial-gradient(ellipse 900px 600px at 108% 8%, rgba(200,156,255,.14), transparent 60%),
    radial-gradient(ellipse 1100px 700px at 50% 118%, rgba(255,212,71,.10), transparent 60%),
    #173226;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:30px 20px;
}
.wrap{
  width:100%;
  max-width:600px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:20px;
}
.main-title{
  color:#FAF7EA;
  font-family:'Gowun Batang',serif;
  font-size:34pt;
  font-weight:700;
  letter-spacing:4px;
  text-align:center;
  text-shadow:0 2px 12px rgba(0,0,0,.5);
  margin-bottom:6px;
}
.sub-title{
  color:#BFD1C2;
  font-size:13pt;
  letter-spacing:2px;
  text-align:center;
  margin-top:-14px;
  margin-bottom:10px;
}
.songs{
  display:flex; gap:.5rem; flex-wrap:wrap; justify-content:center; margin-bottom:6px;
}
.chip{
  font-size:10pt; padding:.35rem .8rem; border-radius:999px; border:1px solid;
  letter-spacing:.5px;
}
.chip.a{ background:rgba(255,145,102,.18); color:#FF9166; border-color:#FF9166; }
.chip.b{ background:rgba(200,156,255,.18); color:#C89CFF; border-color:#C89CFF; }
.chip.n{ background:rgba(255,212,71,.18); color:#FFD447; border-color:#FFD447; }

.btn-main{
  width:100%;
  background: linear-gradient(135deg,#FF9166,#FFD447,#C89CFF);
  border:none;
  border-radius:18px;
  padding:40px 20px;
  cursor:pointer;
  text-decoration:none;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:10px;
  box-shadow:0 8px 32px rgba(255,145,102,.35);
  transition:transform 0.2s, box-shadow 0.2s;
}
.btn-main:hover{
  transform:translateY(-4px);
  box-shadow:0 14px 40px rgba(255,145,102,.5);
}
.btn-main .icon{font-size:56pt;}
.btn-main .label{
  font-family:'Gowun Batang',serif;
  font-size:26pt;
  font-weight:700;
  color:#241C15;
  letter-spacing:2px;
}
.btn-main .desc{
  font-size:12pt;
  color:#3a2f1f;
  letter-spacing:.5px;
}

.small-row{
  width:100%;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}
.btn-small{
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.2);
  border-radius:14px;
  padding:22px 10px;
  cursor:pointer;
  text-decoration:none;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:8px;
  transition:transform 0.2s, background 0.2s;
}
.btn-small:hover{
  transform:translateY(-3px);
  background:rgba(255,255,255,.12);
}
.btn-small .icon{font-size:30pt;}
.btn-small .label{
  font-family:'Gowun Batang',serif;
  font-size:15pt;
  font-weight:700;
  color:#FAF7EA;
  letter-spacing:1px;
  text-align:center;
}
.btn-small .desc{
  font-size:9.5pt;
  color:#BFD1C2;
  letter-spacing:.3px;
  text-align:center;
}

</style>
</head>
<body>
<div class="wrap">

  <div class="main-title">소프라노 리코더</div>
  <div class="sub-title">리코더 수업 자료</div>
  <div class="songs">
    <span class="chip a">생각해줘요</span>
    <span class="chip b">라 캄파넬라</span>
    <span class="chip n">녹턴</span>
  </div>

  <a href="소프라노 리코더 연주하기.html" class="btn-main">
    <span class="icon">🎼</span>
    <span class="label">수업 시작하기</span>
    <span class="desc">클릭하면 바로 열립니다</span>
  </a>

  <div class="small-row">
    <a href="악보 다운로드.html" class="btn-small">
      <span class="icon">📄</span>
      <span class="label">악보 다운로드</span>
      <span class="desc">곡별 계이름 악보</span>
    </a>
    <a href="리코더운지법 프로그램.exe" class="btn-small" download>
      <span class="icon">🖐️</span>
      <span class="label">운지법 프로그램</span>
      <span class="desc">실행 파일 다운로드</span>
    </a>
  </div>


</div>
</body>
</html>
